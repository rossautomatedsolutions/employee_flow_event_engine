[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "employee_flow_event_engine"
version = "0.1.0"
description = "Research pipeline for ESPP event studies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "yfinance>=0.2.44",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
