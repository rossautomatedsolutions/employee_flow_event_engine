# Main-machine validation example using canonical Trading Foundation daily EOD data.
# This config keeps the same reviewed business-day ESPP fixture workflow as
# offline_business_day_example.yaml, but replaces the price fixture with the
# upstream Trading_Foundation historical_data root.
benchmark: SPY
price_source: trading_foundation
price_data_path: "C:/Users/RAS/OneDrive/RAS/Trading/Live/Trading_Foundation/historical_data"
start_date: "2024-06-28"
end_date: "2025-01-03"
output_dir: "artifacts/trading_foundation_business_day_example"

filings:
  fixture_dir: "fixtures/sec_filings"

reviews:
  review_file: "config/espp_business_day_reviews.csv"

tickers:
  - ticker: AAPL
    market_cap: 3000000000000
    employees: 161000
  - ticker: CRM
    market_cap: 280000000000
    employees: 73600

event_study:
  window_before: 1
  window_after: 1
  volume_lookback: 5

strategy:
  entry_tau: 1
  exit_tau: 1
  volume_spike_threshold: 1.0
  min_confidence: 0.4

cross_section:
  market_cap_bins: [500000000000, 2000000000000]
  volatility_bins: [0.018, 0.032]
  employee_heavy_threshold: 100000
