# Phase 3A.3 reviewed cache-only pilot using dual-review consensus decisions.
# First generate or refresh the packet with config/phase3_live_sec_pilot_cache_only.yaml.
# Then fill review_decisions_reviewer_a.csv and review_decisions_reviewer_b.csv,
# rerun the same cache-only config to refresh review_consensus_decisions.csv,
# and finally run this config to produce validated windows from the consensus file.
benchmark: SPY
universe_file: "config/sp500_universe_2026-07-04.csv"
ticker_subset:
  - AAPL
  - AMZN
  - CRM
  - MSFT
  - NVDA
start_date: "2024-06-28"
end_date: "2025-01-03"
output_dir: "artifacts/phase3_live_sec_pilot_cache_only_consensus_reviewed"
cache_dir: "artifacts/phase2_live_sec_cache"
resume_mode: true
offline_mode: false
max_companies: 5

price_source: csv
price_data_path: "fixtures/prices/phase2_research_sample_prices.csv"

filings:
  source: sec
  forms:
    - 10-K
    - 10-K/A
    - DEF 14A
  filing_start_date: "2023-07-01"
  filing_end_date: "2026-05-31"
  max_filings_per_issuer: 6
  cache_only: true
  request_delay_seconds: 0.2
  max_retries: 3
  timeout_seconds: 30

reviews:
  review_file: "artifacts/phase3_live_sec_pilot_cache_only/review_consensus_decisions.csv"

phase3:
  enabled: true
  screened_only: true
  diagnostic_extract_from_unscreened_filings: false
  context_window_chars: 240
  require_review_for_validated_windows: true
  generate_provisional_unreviewed_windows: false

event_study:
  window_before: 1
  window_after: 1
  volume_lookback: 5
